# Mr Keyboard: automatic checks. Publishes nothing and keeps no APK.
#
# Runs on every push to main and on pull requests that touch the app (or by hand, via Run workflow). It is also the gate of
# the release: mr-apk.yml calls it (workflow_call) and only publishes if both jobs below pass.
# Each step is a script in docs/tools/ that also runs on your computer (see the comment in the script).
#
# quick    (seconds, Python and Java only):
#   check_version.py     apktool.yml/json version (and the APK name in them) is coherent and the version notes exist in docs/release-notes/
#                        (also warns when a docs/plan-*.md whose target version was reached is still there)
#   check_workflows.py   workflows: actions pinned by commit, minimal permissions, mr-apk.yml publishes only after these checks
#   check_catalog_url.py the app reads the dictionary catalog from the latest release (next to the APK)
#   check_update_url.py  the update notice (update.json) is made, signed and attached with the same names the app will read
#   check_reset_keys.py  "Restaurar padrões" (Restore defaults) covers every key of the settings screens
#   mres_check.py        Portuguese text of the sheets/attachments editor goes through the Spanish table
#   res_check.py         resources: valid XML, public.xml, references, unused resources, Spanish vs Portuguese
#   check_emoji_search.py  the emoji search (1.97.0): the tags the Java looks for are in the layout, the floating bar is inside the emoji panel, the texts
#                        in 3 languages, the three hooks in MrTools.smali, and the CLDR words (res/raw/mr_emoji_*) list the emojis of the panel in its order
#   test_make_emoji_search.py  make_emoji_search.py (the converter of the CLDR files) with made-up files: FE0F, derived annotations, a language missing, a zip
#   make_themes.py --check  the generated themes, solid, gloss and neon (their drawables, layouts, colors and entries in the theme lists),
#                        are what the generator writes today from its tables: a hand edit of a generated file, or a table changed without running it, fails
#   smali_regcheck.py    hand-edited smali: register read without a value (the error that closed Settings in 1.67),
#                        register above the instruction limit (e.g. p0 = v17 in a plain invoke), more than 5 registers in a
#                        plain invoke (the assembler refuses with "Invalid register count"), a call to a method that does not exist and a field that does not
#                        exist (the NoSuchFieldError that closed Settings after the dead-code cleanup: a <clinit> still filling removed fields)
#   check_stub_api.py    every method and field the Java layer uses exists, with the same signature, in the APK (the smali; there it must also not be
#                        private in another class, and be static or not as the code uses it) and, with the Android SDK jar of the runner, in android.*
#                        (the stubs of docs/tools/java/stubs are hand-written: a wrong return type compiles and only fails on the device)
#   run_java_tests.sh    PC tests of the Java layer (author card, main-screen link, re-correction: word under the cursor and
#                        neighbour keys, recent words, the update notice: signature, versions, replay, checking windows, the fonts tool:
#                        the 27 Unicode styles, the fields that take no style, the delete of a styled letter, the light of the neon
#                        themes: glow of labels and icons, the hue of each key in the spectrum themes, the dark labels of the light themes;
#                        gesture typing in the keyboard, GestureInputTest: which touches are followed, tap and long press unchanged,
#                        what is written, the strip, backspace, the trail, the word shown while the finger slides, the blocked words,
#                        all with a fake recognition; GestureWordsTest: the words of the person as the small dictionary the gestures search;
#                        EmojiSearchTest: the emoji search in three languages (accents, ranking, tie by app language) and the extra height of a header)
#   test_smali_regcheck.py  smali_regcheck.py itself: each of its five rules with a broken and a good case (registers, methods, limits, invoke size, fields), --base, the real smali
#   test_toolbar_row.py  the rule of the toolbar row, on the real smali of MrTools.rowOwned/applyMain in the mini Dalvik interpreter: with any tool header open (clipboard, translator, attachments, emojis,
#                        Customize, Fonts, emoji search, a new bar_*) the bar_main row (tools and suggestions strip) stays hidden; the headers start hidden in the layout
#   test_suggestions_suspended.py  the real smali of the LatinIME methods that run the suggestions: nothing is searched or reopened (and the strip is emptied) with a tool on the
#                        toolbar row or a font style on, as before otherwise; mrEndWord; the space after a suggestion picked for a reopened word at the end of the text
#   test_sugg_idle.py    the real smali of MrSugg (strip or tools in the toolbar row) with a fake clock: typing brings the strip back, the debounce of the end of the word (pref_sugg_idle, 3 s by default,
#                        off, restart, cancel by typing), nothing counts under a tool or with the row hidden, the 1 s hold of an empty list; MrTools.toggleBar only shows/hides the row
#   test_grid_key.py     the grid key (MrTools.toggleBar) on the real smali of MrTools and MrSugg together: a tool open (header, AI Editor or Customize dialog) is closed as its back button does and the tools
#                        take the row; the strip in view gives way to the tools; only with the tools in view it shows/hides the row
#   test_ui_language_rebuild.py  changing the app language rebuilds the keyboard view once, on the change (LatinIME.onSharedPreferenceChanged), and the bar is inflated again in the new language
#   test_make_catalog.py builds the dictionary catalog (the release of each zip, only changed languages get a zip, serial; trigrams.bin MRT2 needs minApp 1090000;
#                        the "models" list with the weights of the gesture recognition, which older apps do not read)
#   test_mrt_format.py   the two layouts of trigrams.bin (MRT1, MRT2): round trips, limits, every kind of damaged file, the converter
#   test_add_loanwords.py  add_loanwords.py (common English words added to the dictionary of a pack): what is added and what is not, the frequency band,
#                        nothing else in the dictionary changes, a second run changes nothing, the shipped packs match the list
#   test_prune_order.py  the cleanup of the learned pairs (UserBigramDictionary): reads the two tables, the caps and the ORDER BY out of the smali and runs the cleanup in SQLite:
#                        the most used pairs survive, the least used go first, the old query is told apart
#   test_make_update.py  builds the update notice (version, APK size and SHA-256, notes in both languages, every error that must stop a release)
#   corpus/test_real.py  the real-message evaluation tools (sampler with fake Arctic Shift / Hugging Face servers: retries, 429, timeouts, a failing source;
#                        cleaner and language filter; the manual workflow mr-corpus-real.yml; the acceptance rule for a candidate pack)
#   corpus/test_pack_data.py  make_pack_data.py with made-up corpora: the optional fourth source (real messages), the admission of new words,
#                        pairs and trigrams, a pack built without `real` does not change, the errors of a wrong --mix
#   publish_test/run.sh  publish_release.sh end to end with a fake gh and the real signature
# assemble (a few minutes):
#   check_java_smali.sh  the Mr*.smali files are what build_java.sh generates today from the Java sources
#   apktool b            all the smali assembles (aapt2 reports a missing resource)
#   verify_dex.sh        the dex2jar verifier finds no error in the assembled dex
#   smali_regcheck.py    again, on the smali decoded from the assembled APK
#   run_java_tests.sh    with the APK jar: Spanish tests (SheetStrings/MrEs)
#   run_strategy_tests.sh one check per suggestion strategy (docs/suggestion-features.md, ids S1...), 3 languages, native engine (the only
#                        search since 1.87.0), with the dictionaries in dicts/ (a change in dicts/ alone also starts the checks); S28 types
#                        original everyday sentences (docs/tools/e2e/data/) and fails when a hit rate falls under its floor
#   run_gesture_tests.sh  gesture typing, the recognition only (MrGesture over the native engine): the real
#                        gestures of gesture/test through the app classes, 3 languages, on dicts/ and on the copy in the format v2; fails
#                        when the count of right words falls under its floor. Also with the words of the person: the APK's
#                        own tree of learned words (its hand-edited addWord), read and written by MrGestureWords, searched by the lib
#   run_gesture_input_tests.sh  gesture typing in the keyboard (MrGestureInput, 1.96.0), from the touch events to the text with the real
#                        recognition: the same gestures drawn as touches on a fake keyboard, 3 languages; fails when the words written
#                        fall under their floors (a wrong frame of keys or points would show here and nowhere else before the phone).
#                        Each language is drawn again with the words of the person and with the word shown while sliding
#   packs_test/run_packs_tests.sh  the dictionary download flow (signed catalog, tampered or truncated zips, install, update, remove, the
#                        keyboard languages), the 3 installed languages and the gesture recognition pack (ModelPackTest: the "models" list,
#                        download, checks, update, remove, the weights picked from a file), with a test key made on the spot, the packs
#                        of dicts/ and the weights of gesture/
name: Mr Keyboard - checks

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - 'smali/**'
      - 'res/**'
      - 'AndroidManifest.xml'
      - 'apktool.yml'
      - 'apktool.json'
      - 'docs/tools/**'
      - 'docs/release-notes/*.md'
      - 'engine/**'
      - 'native/**'
      - 'gesture/**'
      - 'dicts/**'
      - '.github/workflows/*.yml'
  push:
    branches: [main]
    paths:
      - 'smali/**'
      - 'res/**'
      - 'AndroidManifest.xml'
      - 'apktool.yml'
      - 'apktool.json'
      - 'docs/tools/**'
      - 'docs/release-notes/*.md'
      - 'engine/**'
      - 'native/**'
      - 'gesture/**'
      - 'dicts/**'
      - '.github/workflows/*.yml'

permissions:
  contents: read

env:
  APKTOOL_VERSION: 2.11.1
  DEX2JAR_URL: https://github.com/pxb1988/dex2jar/releases/download/v2.1/dex2jar-2.1.zip
  DEX2JAR_SHA256: 7a9bdf843d43de4d1e94ec2e7b6f55825017b0c4a7ee39ff82660e2493a46f08

jobs:
  quick:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Version and version notes
        run: python3 docs/tools/check_version.py

      - name: Workflows (pinned actions, minimal permissions, publishing only after the checks)
        run: python3 docs/tools/check_workflows.py

      - name: Dictionary catalog read from the APK's release
        run: python3 docs/tools/check_catalog_url.py

      - name: Update notice read from the APK's release
        run: python3 docs/tools/check_update_url.py

      - name: Restore defaults covers every key
        run: python3 docs/tools/check_reset_keys.py

      - name: Sheet editor texts in Spanish
        run: python3 docs/tools/mres_check.py

      - name: Resources
        run: python3 docs/tools/res_check.py

      - name: Emoji search (layout, texts, hooks, the CLDR words of the three languages)
        run: python3 docs/tools/check_emoji_search.py

      - name: Emoji search words (the CLDR converter, with made-up files)
        run: python3 -I docs/tools/emoji_search_test/test_make_emoji_search.py

      - name: Generated themes up to date with their generator
        run: python3 docs/tools/make_themes.py --check

      - name: Smali - registers, methods and fields
        run: python3 docs/tools/smali_regcheck.py smali

      - name: Smali check itself (its rules on broken and good examples)
        run: python3 -I docs/tools/test_smali_regcheck.py

      - name: App language rebuilds the keyboard (the toolbar and the tools show the new language at once)
        run: python3 -I docs/tools/test_ui_language_rebuild.py

      - name: Toolbar row (a tool using the row keeps the suggestions strip out)
        run: python3 -I docs/tools/test_toolbar_row.py

      - name: Suggestions stop with a tool on the row or a font style on, and the space after a suggestion
        run: python3 -I docs/tools/test_suggestions_suspended.py

      - name: Strip or tools in the row (typing, debounce after the word, bar key)
        run: python3 -I docs/tools/test_sugg_idle.py

      - name: Grid key (closes the tool open, strip to tools, else shows/hides the row)
        run: python3 -I docs/tools/test_grid_key.py

      - name: Java layer calls exist in the APK and in the Android SDK
        run: |
          # the runner image has the Android SDK: its newest platform is the reference jar (without one, only the APK side is checked,
          # and what an APK class inherits from the framework is taken on trust)
          JAR=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/platforms/android-*/android.jar 2>/dev/null | sort -V | tail -1 || true)
          echo "android.jar: ${JAR:-none}"
          ANDROID_JAR="$JAR" python3 docs/tools/check_stub_api.py

      - name: PC tests of the Java layer
        run: sh docs/tools/run_java_tests.sh

      - name: Dictionary catalog
        run: python3 -I docs/tools/test_make_catalog.py

      - name: trigrams.bin formats (MRT1 and MRT2 readers and writers, conversion, damaged files)
        run: python3 -I docs/tools/test_mrt_format.py

      - name: Foreign words added to a pack
        run: python3 -I docs/tools/test_add_loanwords.py

      - name: Cleanup of the learned pairs
        run: python3 -I docs/tools/test_prune_order.py

      - name: Update notice
        run: python3 -I docs/tools/test_make_update.py

      - name: Real-message tools (sampler, cleaner, acceptance rule)
        run: python3 -I docs/tools/corpus/test_real.py

      - name: Pack data (sources, admission of words, pairs and trigrams)
        run: python3 -I docs/tools/corpus/test_pack_data.py

      - name: Release publishing (with a fake gh)
        run: bash docs/tools/publish_test/run.sh

  assemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Download apktool and dex2jar
        run: |
          curl -sSL -o apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v$APKTOOL_VERSION/apktool_$APKTOOL_VERSION.jar"
          curl -sSL -o dex2jar.zip "$DEX2JAR_URL"
          echo "$DEX2JAR_SHA256  dex2jar.zip" | sha256sum -c -
          unzip -q dex2jar.zip -d tools

      - name: Java-layer smali up to date
        env:
          DX_JAR: ${{ github.workspace }}/tools/dex-tools-2.1/lib/dx-27.0.3.jar
          APKTOOL_JAR: ${{ github.workspace }}/apktool.jar
        run: sh docs/tools/check_java_smali.sh

      - name: Assemble the APK (only to verify)
        run: java -jar apktool.jar b . -o verify.apk

      - name: Verify the dex
        run: sh docs/tools/verify_dex.sh verify.apk tools/dex-tools-2.1 "$RUNNER_TEMP/dex"

      - name: Assembled smali - registers, methods and fields
        run: |
          java -jar apktool.jar d -f -o "$RUNNER_TEMP/dec" verify.apk > /dev/null
          python3 docs/tools/smali_regcheck.py "$RUNNER_TEMP"/dec/smali*

      - name: Spanish tests with the APK jar
        run: sh docs/tools/run_java_tests.sh "$RUNNER_TEMP/dex/classes.jar"

      - name: Suggestion strategies - one check per strategy (3 languages, native engine)
        run: bash docs/tools/e2e/run_strategy_tests.sh "$RUNNER_TEMP/dex/classes.jar"

      - name: Dictionary format v2 - builder (a 14 MB synthetic dictionary, round trips) and the C++ reader (every word and pair)
        run: |
          python3 -I docs/tools/dict_v2_test.py --keep "$RUNNER_TEMP/big"
          python3 -I docs/tools/make_v2_dicts.py "$RUNNER_TEMP/dicts_v2"
          cmake -S native -B "$RUNNER_TEMP/host-native" -DCMAKE_BUILD_TYPE=Release -DMR_HOST_TEST=ON
          cmake --build "$RUNNER_TEMP/host-native" -j4
          bash docs/tools/dict_readback.sh "$RUNNER_TEMP/host-native/dict_test" dicts
          bash docs/tools/dict_readback.sh "$RUNNER_TEMP/host-native/dict_test" "$RUNNER_TEMP/dicts_v2"
          bash docs/tools/dict_readback.sh "$RUNNER_TEMP/host-native/dict_test" "$RUNNER_TEMP/big"

      - name: Dictionary format v2 - suggestion strategies on a copy of dicts/ in v2 (3 languages)
        env:
          DICTS: ${{ runner.temp }}/dicts_v2
        run: OUT="$RUNNER_TEMP/strategy_v2" bash docs/tools/e2e/run_strategy_tests.sh "$RUNNER_TEMP/dex/classes.jar"

      - name: Gesture typing - the recognition through the app classes (3 languages, native engine)
        run: OUT="$RUNNER_TEMP/gesture" bash docs/tools/e2e/run_gesture_tests.sh "$RUNNER_TEMP/dex/classes.jar"

      - name: Gesture typing - the same on the copy of dicts/ in the format v2
        env:
          DICTS: ${{ runner.temp }}/dicts_v2
        run: OUT="$RUNNER_TEMP/gesture_v2" bash docs/tools/e2e/run_gesture_tests.sh "$RUNNER_TEMP/dex/classes.jar"

      - name: Gesture typing - from the touch on the keys to the text (MrGestureInput, 3 languages, native engine)
        run: OUT="$RUNNER_TEMP/gesture_input" bash docs/tools/e2e/run_gesture_input_tests.sh

      - name: Dictionary packs and the gesture recognition pack - download flow and the 3 installed languages (PC, test key)
        run: bash docs/tools/packs_test/run_packs_tests.sh "$RUNNER_TEMP/dex/classes.jar"
