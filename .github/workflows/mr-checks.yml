# Mr Keyboard: automatic checks. Publishes nothing and keeps no APK.
#
# Runs on every push to main and on pull requests that touch the app (or by hand, via Run workflow). It is also the gate of
# the release: mr-apk.yml calls it (workflow_call) and only publishes if both jobs below pass.
# Each step is a script in docs/tools/ that also runs on your computer (see the comment in the script).
#
# quick    (seconds, Python and Java only):
#   check_version.py     apktool.yml/json version is coherent and the version notes exist in docs/release-notes/
#                        (also warns when a docs/plan-*.md whose target version was reached is still there)
#   check_workflows.py   workflows: actions pinned by commit, minimal permissions, mr-apk.yml publishes only after these checks
#   check_catalog_url.py the app reads the dictionary catalog from the latest release (next to the APK)
#   check_update_url.py  the update notice (update.json) is made, signed and attached with the same names the app will read
#   check_reset_keys.py  "Restaurar padrões" (Restore defaults) covers every key of the settings screens
#   mres_check.py        Portuguese text of the sheets/attachments editor goes through the Spanish table
#   res_check.py         resources: valid XML, public.xml, references, unused resources, Spanish vs Portuguese
#   smali_regcheck.py    hand-edited smali: register read without a value (the error that closed Settings in 1.67),
#                        register above the instruction limit (e.g. p0 = v17 in a plain invoke), more than 5 registers in a
#                        plain invoke (the assembler refuses with "Invalid register count") and a call to a method that does not exist
#   run_java_tests.sh    PC tests of the Java layer (author card, main-screen link, re-correction: word under the cursor and
#                        neighbour keys, recent words, the update notice: signature, versions, replay, checking windows)
#   test_make_catalog.py builds the dictionary catalog (the release of each zip, only changed languages get a zip, serial; trigrams.bin MRT2 needs minApp 1090000)
#   test_mrt_format.py   the two layouts of trigrams.bin (MRT1, MRT2): round trips, limits, every kind of damaged file, the converter
#   test_add_loanwords.py  add_loanwords.py (common English words added to the dictionary of a pack): what is added and what is not, the frequency band,
#                        nothing else in the dictionary changes, a second run changes nothing, the shipped packs match the list
#   test_make_update.py  builds the update notice (version, APK size and SHA-256, notes in both languages, every error that must stop a release)
#   corpus/test_real.py  the real-message evaluation tools (sampler with fake Arctic Shift / Hugging Face servers: retries, 429, timeouts, a failing source;
#                        cleaner and language filter; the manual workflow mr-corpus-real.yml; the acceptance rule for a candidate pack)
#   corpus/test_pack_data.py  make_pack_data.py with made-up corpora: the optional fourth source (real messages), the admission of new words,
#                        pairs and trigrams, a pack built without `real` does not change, the errors of a wrong --mix
#   publish_test/run.sh  publish_release.sh end to end with a fake gh and the real signature
# assemble (a few minutes):
#   check_java_smali.sh  the Mr*.smali files are what build_java.sh generates today from the Java sources
#   apktool b            all the smali assembles (aapt2 reports a missing resource)
#   verify_dex.sh        the dex2jar verifier finds no error in the assembled dex
#   smali_regcheck.py    again, on the smali decoded from the assembled APK
#   run_java_tests.sh    with the APK jar: Spanish tests (SheetStrings/MrEs)
#   run_strategy_tests.sh one check per suggestion strategy (docs/suggestion-features.md, ids S1...), 3 languages, native engine (the only
#                        search since 1.87.0), with the dictionaries in dicts/ (a change in dicts/ alone also starts the checks); S28 types
#                        original everyday sentences (docs/tools/e2e/data/) and fails when a hit rate falls under its floor
#   packs_test/run_packs_tests.sh  the dictionary download flow (signed catalog, tampered or truncated zips, install, update, remove, the
#                        keyboard languages) and the 3 installed languages, with a test key made on the spot and the packs of dicts/
name: Mr Keyboard - checks

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - 'smali/**'
      - 'res/**'
      - 'AndroidManifest.xml'
      - 'apktool.yml'
      - 'apktool.json'
      - 'docs/tools/**'
      - 'docs/release-notes/*.md'
      - 'engine/**'
      - 'native/**'
      - 'dicts/**'
      - '.github/workflows/*.yml'
  push:
    branches: [main]
    paths:
      - 'smali/**'
      - 'res/**'
      - 'AndroidManifest.xml'
      - 'apktool.yml'
      - 'apktool.json'
      - 'docs/tools/**'
      - 'docs/release-notes/*.md'
      - 'engine/**'
      - 'native/**'
      - 'dicts/**'
      - '.github/workflows/*.yml'

permissions:
  contents: read

env:
  APKTOOL_VERSION: 2.11.1
  DEX2JAR_URL: https://github.com/pxb1988/dex2jar/releases/download/v2.1/dex2jar-2.1.zip
  DEX2JAR_SHA256: 7a9bdf843d43de4d1e94ec2e7b6f55825017b0c4a7ee39ff82660e2493a46f08

jobs:
  quick:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Version and version notes
        run: python3 docs/tools/check_version.py

      - name: Workflows (pinned actions, minimal permissions, publishing only after the checks)
        run: python3 docs/tools/check_workflows.py

      - name: Dictionary catalog read from the APK's release
        run: python3 docs/tools/check_catalog_url.py

      - name: Update notice read from the APK's release
        run: python3 docs/tools/check_update_url.py

      - name: Restore defaults covers every key
        run: python3 docs/tools/check_reset_keys.py

      - name: Sheet editor texts in Spanish
        run: python3 docs/tools/mres_check.py

      - name: Resources
        run: python3 docs/tools/res_check.py

      - name: Smali - registers and methods
        run: python3 docs/tools/smali_regcheck.py smali

      - name: PC tests of the Java layer
        run: sh docs/tools/run_java_tests.sh

      - name: Dictionary catalog
        run: python3 -I docs/tools/test_make_catalog.py

      - name: trigrams.bin formats (MRT1 and MRT2 readers and writers, conversion, damaged files)
        run: python3 -I docs/tools/test_mrt_format.py

      - name: Foreign words added to a pack
        run: python3 -I docs/tools/test_add_loanwords.py

      - name: Update notice
        run: python3 -I docs/tools/test_make_update.py

      - name: Real-message tools (sampler, cleaner, acceptance rule)
        run: python3 -I docs/tools/corpus/test_real.py

      - name: Pack data (sources, admission of words, pairs and trigrams)
        run: python3 -I docs/tools/corpus/test_pack_data.py

      - name: Release publishing (with a fake gh)
        run: bash docs/tools/publish_test/run.sh

  assemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Download apktool and dex2jar
        run: |
          curl -sSL -o apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v$APKTOOL_VERSION/apktool_$APKTOOL_VERSION.jar"
          curl -sSL -o dex2jar.zip "$DEX2JAR_URL"
          echo "$DEX2JAR_SHA256  dex2jar.zip" | sha256sum -c -
          unzip -q dex2jar.zip -d tools

      - name: Java-layer smali up to date
        env:
          DX_JAR: ${{ github.workspace }}/tools/dex-tools-2.1/lib/dx-27.0.3.jar
          APKTOOL_JAR: ${{ github.workspace }}/apktool.jar
        run: sh docs/tools/check_java_smali.sh

      - name: Assemble the APK (only to verify)
        run: java -jar apktool.jar b . -o verify.apk

      - name: Verify the dex
        run: sh docs/tools/verify_dex.sh verify.apk tools/dex-tools-2.1 "$RUNNER_TEMP/dex"

      - name: Assembled smali - registers and methods
        run: |
          java -jar apktool.jar d -f -o "$RUNNER_TEMP/dec" verify.apk > /dev/null
          python3 docs/tools/smali_regcheck.py "$RUNNER_TEMP"/dec/smali*

      - name: Spanish tests with the APK jar
        run: sh docs/tools/run_java_tests.sh "$RUNNER_TEMP/dex/classes.jar"

      - name: Suggestion strategies - one check per strategy (3 languages, native engine)
        run: bash docs/tools/e2e/run_strategy_tests.sh "$RUNNER_TEMP/dex/classes.jar"

      - name: Dictionary format v2 - builder (a 14 MB synthetic dictionary, round trips) and the C++ reader (every word and pair)
        run: |
          python3 -I docs/tools/dict_v2_test.py --keep "$RUNNER_TEMP/big"
          python3 -I docs/tools/make_v2_dicts.py "$RUNNER_TEMP/dicts_v2"
          cmake -S native -B "$RUNNER_TEMP/host-native" -DCMAKE_BUILD_TYPE=Release -DMR_HOST_TEST=ON
          cmake --build "$RUNNER_TEMP/host-native" -j4
          bash docs/tools/dict_readback.sh "$RUNNER_TEMP/host-native/dict_test" dicts
          bash docs/tools/dict_readback.sh "$RUNNER_TEMP/host-native/dict_test" "$RUNNER_TEMP/dicts_v2"
          bash docs/tools/dict_readback.sh "$RUNNER_TEMP/host-native/dict_test" "$RUNNER_TEMP/big"

      - name: Dictionary format v2 - suggestion strategies on a copy of dicts/ in v2 (3 languages)
        env:
          DICTS: ${{ runner.temp }}/dicts_v2
        run: OUT="$RUNNER_TEMP/strategy_v2" bash docs/tools/e2e/run_strategy_tests.sh "$RUNNER_TEMP/dex/classes.jar"

      - name: Dictionary packs - download flow and the 3 installed languages (PC, test key)
        run: bash docs/tools/packs_test/run_packs_tests.sh "$RUNNER_TEMP/dex/classes.jar"
