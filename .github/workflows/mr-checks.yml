# Mr Keyboard: automatic checks. Publishes nothing and keeps no APK.
#
# Runs on every push to main and on pull requests that touch the app (or by hand, via Run workflow).
# Each step is a script in docs/tools/ that also runs on your computer (see the comment in the script).
#
# quick    (seconds, Python and Java only):
#   check_version.py     apktool.yml/json version is coherent and the version notes exist in docs/release-notes/
#                        (also warns when a docs/plan-*.md whose target version was reached is still there)
#   check_catalog_url.py the app reads the dictionary catalog from the latest release (next to the APK)
#   check_reset_keys.py  "Restaurar padrões" (Restore defaults) covers every key of the settings screens
#   mres_check.py        Portuguese text of the sheets/attachments editor goes through the Spanish table
#   res_check.py         resources: valid XML, public.xml, references, unused resources, Spanish vs Portuguese
#   smali_regcheck.py    hand-edited smali: register read without a value (the error that closed Settings in 1.67),
#                        register above the instruction limit (e.g. p0 = v17 in a plain invoke), more than 5 registers in a
#                        plain invoke (the assembler refuses with "Invalid register count") and a call to a method that does not exist
#   run_java_tests.sh    PC tests of the Java layer (author card, main-screen link, re-correction: word under the cursor and
#                        neighbour keys, recent words)
#   test_make_catalog.py builds the dictionary catalog (one zip per language, serial, old versions)
#   publish_test/run.sh  publish_release.sh end to end with a fake gh and the real signature
# assemble (a few minutes):
#   check_java_smali.sh  the Mr*.smali files are what build_java.sh generates today from the Java sources
#   apktool b            all the smali assembles (aapt2 reports a missing resource)
#   verify_dex.sh        the dex2jar verifier finds no error in the assembled dex
#   smali_regcheck.py    again, on the smali decoded from the assembled APK
#   run_java_tests.sh    with the APK jar: Spanish tests (SheetStrings/MrEs)
#   run_native_parity.sh native engine (engine/): correction search, suggestion list and trigrams through Java and through the
#                        PC libmrengine.so must give the same result in the 3 languages, with the dictionaries in dicts/
name: Mr Keyboard - checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'smali/**'
      - 'res/**'
      - 'AndroidManifest.xml'
      - 'apktool.yml'
      - 'apktool.json'
      - 'docs/tools/**'
      - 'docs/release-notes/*.md'
      - 'engine/**'
      - 'native/**'
      - '.github/workflows/mr-checks.yml'
  push:
    branches: [main]
    paths:
      - 'smali/**'
      - 'res/**'
      - 'AndroidManifest.xml'
      - 'apktool.yml'
      - 'apktool.json'
      - 'docs/tools/**'
      - 'docs/release-notes/*.md'
      - 'engine/**'
      - 'native/**'
      - '.github/workflows/mr-checks.yml'

permissions:
  contents: read

env:
  APKTOOL_VERSION: 2.11.1
  DEX2JAR_URL: https://github.com/pxb1988/dex2jar/releases/download/v2.1/dex2jar-2.1.zip
  DEX2JAR_SHA256: 7a9bdf843d43de4d1e94ec2e7b6f55825017b0c4a7ee39ff82660e2493a46f08

jobs:
  quick:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Version and version notes
        run: python3 docs/tools/check_version.py

      - name: Dictionary catalog read from the APK's release
        run: python3 docs/tools/check_catalog_url.py

      - name: Restore defaults covers every key
        run: python3 docs/tools/check_reset_keys.py

      - name: Sheet editor texts in Spanish
        run: python3 docs/tools/mres_check.py

      - name: Resources
        run: python3 docs/tools/res_check.py

      - name: Smali - registers and methods
        run: python3 docs/tools/smali_regcheck.py smali

      - name: PC tests of the Java layer
        run: sh docs/tools/run_java_tests.sh

      - name: Dictionary catalog
        run: python3 -I docs/tools/test_make_catalog.py

      - name: Release publishing (with a fake gh)
        run: bash docs/tools/publish_test/run.sh

  assemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download apktool and dex2jar
        run: |
          curl -sSL -o apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v$APKTOOL_VERSION/apktool_$APKTOOL_VERSION.jar"
          curl -sSL -o dex2jar.zip "$DEX2JAR_URL"
          echo "$DEX2JAR_SHA256  dex2jar.zip" | sha256sum -c -
          unzip -q dex2jar.zip -d tools

      - name: Java-layer smali up to date
        env:
          DX_JAR: ${{ github.workspace }}/tools/dex-tools-2.1/lib/dx-27.0.3.jar
          APKTOOL_JAR: ${{ github.workspace }}/apktool.jar
        run: sh docs/tools/check_java_smali.sh

      - name: Assemble the APK (only to verify)
        run: java -jar apktool.jar b . -o verify.apk

      - name: Verify the dex
        run: sh docs/tools/verify_dex.sh verify.apk tools/dex-tools-2.1 "$RUNNER_TEMP/dex"

      - name: Assembled smali - registers and methods
        run: |
          java -jar apktool.jar d -f -o "$RUNNER_TEMP/dec" verify.apk > /dev/null
          python3 docs/tools/smali_regcheck.py "$RUNNER_TEMP"/dec/smali*

      - name: Spanish tests with the APK jar
        run: sh docs/tools/run_java_tests.sh "$RUNNER_TEMP/dex/classes.jar"

      - name: Native engine - live Java x C++ parity (3 languages, dictionaries from dicts/)
        env:
          WORDS: '1200'
          SUGG: '1000'
        run: bash docs/tools/e2e/run_native_parity.sh "$RUNNER_TEMP/dex/classes.jar"
