# Mr Keyboard: builds the two native libs with the NDK (4 architectures) and tests them on the PC.
#
#   native/  -> libjni_pckeyboard.so  dictionary reader (Hacker's Keyboard / LatinIME)
#   engine/  -> libmrengine.so        native engine (1.77): correction search and trigrams in C++
#
# Only runs when the native code changes (native/** or engine/**) or when you trigger it (Run workflow).
# The APK does NOT depend on this workflow: it uses the libs that are already in lib/ (see mr-apk.yml).
#
# When native/ or engine/ changes:
#   1. run this workflow (or wait for the push to run it);
#   2. download the "native-libs" artifact and extract it at the project ROOT, merging (creates/updates lib/<abi>/, native-src.sha256,
#      mrengine-src.sha256 and mrengine-info.txt);
#   3. commit lib/ and those files together with the change.
# native-src.sha256 and mrengine-src.sha256 say which code each lib was built from. mr-apk.yml compares them with the current
# code: if they differ, it warns (and does not publish) so you never ship an APK with a stale lib.
# The engine parity with Java (Java vs C++ live) runs in mr-checks.yml, which has the APK assembled.
name: Mr Keyboard - native lib

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'engine/**'
      - '.github/workflows/mr-native.yml'

permissions:
  contents: read

env:
  NDK_VERSION: 27.2.12479018

jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: NDK (uses the runner one or installs it with sdkmanager)
        id: ndk
        run: |
          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [ ! -d "$NDK" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          fi
          test -f "$NDK/build/cmake/android.toolchain.cmake"
          echo "dir=$NDK" >> "$GITHUB_OUTPUT"

      - name: Build for arm64-v8a, armeabi-v7a, x86 and x86_64 (both libs)
        run: |
          NDK="${{ steps.ndk.outputs.dir }}"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            for proj in native engine; do
              cmake -S "$proj" -B "build/$abi/$proj" \
                -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI="$abi" -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release
              cmake --build "build/$abi/$proj" -j4
            done
            mkdir -p "out/lib/$abi"
            cp "build/$abi/native/libjni_pckeyboard.so" "build/$abi/engine/libmrengine.so" "out/lib/$abi/"
          done
          ls -l out/lib/*/

      - name: Check (16 KB alignment, JNI function registration, no libc++_shared)
        run: |
          RE="${{ steps.ndk.outputs.dir }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for so in out/lib/*/libjni_pckeyboard.so out/lib/*/libmrengine.so; do
            echo "== $so"
            "$RE" -lW "$so" | grep LOAD
            "$RE" -lW "$so" | grep LOAD | awk '{ if ($NF != "0x4000") { print "wrong alignment: " $NF; exit 1 } }'
            "$RE" --dyn-syms "$so" | grep -q JNI_OnLoad
            # the app does not ship libc++_shared.so
            if "$RE" -d "$so" | grep -q "libc++_shared"; then echo "depends on libc++_shared.so"; exit 1; fi
          done
          for so in out/lib/*/libjni_pckeyboard.so; do strings "$so" | grep -q "com/mrkeyboard/app/BinaryDictionary"; done
          for so in out/lib/*/libmrengine.so; do
            strings "$so" | grep -q "com/mrkeyboard/app/MrNative"
            strings "$so" | grep -q "nSearch"
          done

      - name: PC test of the dictionary lib (dict_test, with the project dictionary)
        run: |
          cmake -S native -B build/host-native -DCMAKE_BUILD_TYPE=Release -DMR_HOST_TEST=ON
          cmake --build build/host-native -j4
          ./build/host-native/dict_test dicts/pt-BR/main.dict native/test/sample_words.tsv \
              native/test/sample_bigrams.tsv native/test/cases.tsv 5 | grep -v "^OK\|^FAIL"

      - name: PC test of the engine (engine/ with the dictionaries in dicts/ - search, trigrams, corrupt files, edge cases)
        run: |
          cmake -S engine -B build/host-engine -DCMAKE_BUILD_TYPE=Release -DMR_HOST_TEST=ON
          cmake --build build/host-engine -j4
          ./build/host-engine/mr_test dicts 100
          ./build/host-engine/mr_bench dicts 5

      - name: Engine JNI bridge (RegisterNatives and bad arguments, with the runner Java)
        run: |
          mkdir -p build/jc
          javac -nowarn -encoding UTF-8 -d build/jc engine/test/java/com/mrkeyboard/app/*.java
          java -Dfile.encoding=UTF-8 -cp build/jc com.mrkeyboard.app.JniSmoke build/host-engine/libmrengine.so dicts

      - name: Engine with ASan + UBSan (corrupt files)
        run: |
          cmake -S engine -B build/san-engine -DCMAKE_BUILD_TYPE=RelWithDebInfo -DMR_HOST_TEST=ON -DMR_SANITIZE=ON
          cmake --build build/san-engine -j4
          ./build/san-engine/mr_test dicts 150

      - name: Record which code the libs were built from
        run: |
          # only what goes into the build (CMakeLists and src/); the test files do not change the libs
          find native/CMakeLists.txt native/src -type f -print0 | LC_ALL=C sort -z \
            | xargs -0 sha256sum | sha256sum | cut -d' ' -f1 > out/native-src.sha256
          # the engine hash is computed from inside engine/ (paths CMakeLists.txt and src/...); mr-apk.yml does the same
          (cd engine && find CMakeLists.txt src -type f -print0 | LC_ALL=C sort -z \
            | xargs -0 sha256sum | sha256sum | cut -d' ' -f1) > out/mrengine-src.sha256
          V=$(grep -o 'kEngineVersion = [0-9]*' engine/src/mr_engine.h | grep -o '[0-9]*$')
          {
            echo "engine contract (kEngineVersion): $V"
            echo "dictionary lib (sha256 of native/CMakeLists.txt + native/src): $(cat out/native-src.sha256)"
            echo "engine (sha256 of engine/CMakeLists.txt + engine/src): $(cat out/mrengine-src.sha256)"
            echo "commit: $GITHUB_SHA"
            (cd out && sha256sum lib/*/*.so)
          } > out/mrengine-info.txt
          cat out/mrengine-info.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-libs
          path: out
