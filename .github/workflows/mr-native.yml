# Mr Keyboard: compila a lib nativa com o NDK (3 arquiteturas) e testa no PC.
#
# Só roda quando o código nativo muda (native/**) ou quando você manda (Run workflow).
# O APK NÃO depende deste workflow: ele usa as libs que já estão em lib/ (ver mr-apk.yml).
#
# Quando native/ mudar:
#   1. rode (ou espere o push rodar) este workflow;
#   2. baixe o artifact "libs-nativas" e extraia na RAIZ do projeto (cria/atualiza lib/<abi>/ e native-src.sha256);
#   3. faça o commit de lib/ e native-src.sha256 junto com a mudança.
# O native-src.sha256 diz de qual código a lib foi compilada. O mr-apk.yml compara com o native/ atual:
# se forem diferentes, avisa (e não deixa publicar) para você não lançar um APK com lib velha.
name: Mr Keyboard - lib nativa

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/mr-native.yml'

permissions:
  contents: read

env:
  NDK_VERSION: 27.2.12479018

jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: NDK (usa o do runner ou instala pelo sdkmanager)
        id: ndk
        run: |
          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [ ! -d "$NDK" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          fi
          test -f "$NDK/build/cmake/android.toolchain.cmake"
          echo "dir=$NDK" >> "$GITHUB_OUTPUT"

      - name: Compilar para arm64-v8a, armeabi-v7a e x86
        run: |
          NDK="${{ steps.ndk.outputs.dir }}"
          for abi in arm64-v8a armeabi-v7a x86; do
            cmake -S native -B "build/$abi" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release
            cmake --build "build/$abi" -j4
            mkdir -p "out/lib/$abi"
            cp "build/$abi/libjni_pckeyboard.so" "out/lib/$abi/"
          done
          ls -l out/lib/*/

      - name: Conferir (alinhamento de 16 KB, registro das funções JNI)
        run: |
          RE="${{ steps.ndk.outputs.dir }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for so in out/lib/*/libjni_pckeyboard.so; do
            echo "== $so"
            "$RE" -lW "$so" | grep LOAD
            "$RE" -lW "$so" | grep LOAD | awk '{ if ($NF != "0x4000") { print "alinhamento errado: " $NF; exit 1 } }'
            "$RE" --dyn-syms "$so" | grep -q JNI_OnLoad
            strings "$so" | grep -q "com/mrkeyboard/app/BinaryDictionary"
          done

      - name: Teste no PC com o mesmo código (dicionário do projeto)
        run: |
          cmake -S native -B build/host -DCMAKE_BUILD_TYPE=Release -DMR_HOST_TEST=ON
          cmake --build build/host -j4
          ./build/host/dict_test dicts/pt-BR/main.dict native/test/amostra_palavras.tsv \
              native/test/amostra_bigramas.tsv native/test/casos.tsv 5 | grep -v "^OK\|^FALHA"

      - name: Registrar de qual código a lib foi compilada
        run: |
          # só o que entra na compilação (CMakeLists e src/); os arquivos de teste não mudam a lib
          find native/CMakeLists.txt native/src -type f -print0 | LC_ALL=C sort -z \
            | xargs -0 sha256sum | sha256sum | cut -d' ' -f1 > out/native-src.sha256
          cat out/native-src.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: libs-nativas
          path: out
