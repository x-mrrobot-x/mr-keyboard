# Mr Keyboard: monta o APK com o apktool, assina e (opcional) publica em Releases.
#
# Não compila nada nativo: usa as libs que já estão em lib/ (libjni_pckeyboard.so de native/ e libmrengine.so de engine/).
# Para atualizá-las, veja mr-native.yml.
#
# Resultado em Actions > (execução) > Artifacts:
#   apk -> MrKeyboard-unsigned.apk (e MrKeyboard-signed.apk se houver chave nos secrets)
#
# Publicar uma versão: acontece sozinho no push na main quando o versionName do apktool.yml é novo (ainda
# não tem Release com essa tag) e há chave de assinatura nos secrets. Também dá para rodar à mão (Run
# workflow, "publicar" marcado), o que trata qualquer impedimento como erro.
# Cada lançamento é UMA Release, com a tag do versionName (ex.: v1.72.0) e as notas de docs/revisao-<versão>.md:
#   MrKeyboard.apk     o APK assinado (nome fixo, para o link da documentação:
#                      .../releases/latest/download/MrKeyboard.apk)
#   catalogo.json      o catálogo de dicionários, assinado com a mesma chave do APK (o app lê
#                      .../releases/latest/download/catalogo.json)
#   <id>-<versão>.zip  um zip por idioma de dicts/ (só a versão atual de cada idioma)
# A lógica está em docs/tools/publish_release.sh (testada por docs/tools/publish_test/run.sh). Uma tag que
# já existe não é sobrescrita: aumente versionCode/versionName antes. Mudou só um dicionário? Suba a
# version dele em dicts/<id>/pack.json e a versão do app: sai uma Release nova, completa.
# No push automático, sem chave, com a versão já publicada ou com a lib/ desatualizada, nada é publicado
# (só um aviso) e o APK fica nos artefatos.
#
# Assinatura (opcional): Settings > Secrets and variables > Actions, um dos dois jeitos:
#   keystore: KEYSTORE_B64 (arquivo em base64), KEYSTORE_PASS, KEY_ALIAS, KEY_PASS
#   pk8+pem:  KEY_PK8_B64 e CERT_PEM_B64 (os dois arquivos em base64)
# Use a MESMA chave que assina o app hoje; com outra chave o Android não instala por cima.
# A mesma chave assina o catálogo de dicionários (docs/tools/sign_catalog.sh); o app só aceita o catálogo
# assinado pela chave do próprio APK.
name: Mr Keyboard - APK

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar o APK assinado em Releases'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'smali/**'
      - 'res/**'
      - 'assets/**'
      - 'lib/**'
      - 'native-src.sha256'
      - 'apktool.yml'
      - '.github/workflows/mr-apk.yml'

permissions:
  contents: write

concurrency:
  group: mr-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  APKTOOL_VERSION: 2.11.1

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Conferir se lib/ foi compilada do native/ e do engine/ atuais
        id: lib
        env:
          PUBLICAR: ${{ inputs.publicar }}
        run: |
          ATUAL=$(find native/CMakeLists.txt native/src -type f -print0 | LC_ALL=C sort -z \
            | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          GRAVADO=$(cat native-src.sha256 2>/dev/null | tr -d ' \r\n' || true)
          # o motor: a conta é feita de dentro de engine/ (a mesma do mr-native.yml)
          ATUAL_MOTOR=$(cd engine && find CMakeLists.txt src -type f -print0 | LC_ALL=C sort -z \
            | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          GRAVADO_MOTOR=$(cat mrengine-src.sha256 2>/dev/null | tr -d ' \r\n' || true)
          FALTA=""
          for abi in arm64-v8a armeabi-v7a x86; do
            for l in libjni_pckeyboard.so libmrengine.so; do
              [ -s "lib/$abi/$l" ] || FALTA="$FALTA lib/$abi/$l"
            done
          done
          if [ "$ATUAL" = "$GRAVADO" ] && [ "$ATUAL_MOTOR" = "$GRAVADO_MOTOR" ] && [ -z "$FALTA" ]; then
            echo "lib/ confere com o native/ e o engine/ atuais"
            echo "lib_ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "lib_ok=false" >> "$GITHUB_OUTPUT"
          [ "$ATUAL" = "$GRAVADO" ] || echo "native/ mudou: native-src.sha256 é $GRAVADO e o código atual dá $ATUAL"
          [ "$ATUAL_MOTOR" = "$GRAVADO_MOTOR" ] || echo "engine/ mudou: mrengine-src.sha256 é $GRAVADO_MOTOR e o código atual dá $ATUAL_MOTOR"
          [ -z "$FALTA" ] || echo "faltam em lib/:$FALTA"
          MSG="lib/ não foi compilada a partir do native/ e do engine/ atuais. Rode 'Mr Keyboard - lib nativa', extraia o artifact libs-nativas na raiz do projeto e faça o commit."
          if [ "$PUBLICAR" = "true" ]; then
            echo "::error::$MSG Nada foi publicado."; exit 1
          fi
          echo "::warning::$MSG"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Montar o APK com o apktool
        run: |
          curl -sSL -o apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v$APKTOOL_VERSION/apktool_$APKTOOL_VERSION.jar"
          java -jar apktool.jar b . -o MrKeyboard-unsigned.apk
          unzip -lv MrKeyboard-unsigned.apk | grep -E "lib/"

      - name: Assinar (só se os secrets existirem)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          KEY_PK8_B64: ${{ secrets.KEY_PK8_B64 }}
          CERT_PEM_B64: ${{ secrets.CERT_PEM_B64 }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KEYSTORE_B64" ]; then
            # keystore (.jks, .keystore ou .p12) + alias e senhas
            # tira espaços e quebras de linha que entram ao copiar e colar o texto
            printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > key.jks || {
              echo "::error::KEYSTORE_B64 não é base64 válido (texto cortado ou com caracteres a mais)"; exit 1; }
            echo "keystore: $(wc -c < key.jks) bytes"
            keytool -list -keystore key.jks -storepass "$KEYSTORE_PASS" > /dev/null 2>&1 || {
              echo "::error::não abriu o keystore: senha (KEYSTORE_PASS) errada ou arquivo incompleto"; exit 1; }
            keytool -list -keystore key.jks -storepass "$KEYSTORE_PASS" -alias "$KEY_ALIAS" > /dev/null 2>&1 || {
              echo "::error::o alias KEY_ALIAS não existe no keystore"; exit 1; }
            SIGN="--ks key.jks --ks-pass env:KEYSTORE_PASS --ks-key-alias $KEY_ALIAS --key-pass env:KEY_PASS"
          elif [ -n "$KEY_PK8_B64" ] && [ -n "$CERT_PEM_B64" ]; then
            # par de arquivos .pk8 + .x509.pem (ex.: a chave de teste que alguns apps de apktool usam)
            printf '%s' "$KEY_PK8_B64" | tr -d ' \r\n\t' | base64 -d > key.pk8
            printf '%s' "$CERT_PEM_B64" | tr -d ' \r\n\t' | base64 -d > cert.pem
            SIGN="--key key.pk8 --cert cert.pem"
          else
            echo "sem chave: só o APK sem assinatura"; exit 0
          fi
          "$BT/zipalign" -p -f 4 MrKeyboard-unsigned.apk aligned.apk
          "$BT/apksigner" sign $SIGN --out MrKeyboard-signed.apk aligned.apk
          # o SHA-256 do certificado tem que ser igual ao do app instalado hoje
          "$BT/apksigner" verify --print-certs MrKeyboard-signed.apk
          rm -f key.jks key.pk8 cert.pem aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: MrKeyboard-*.apk

      - name: Publicar em Releases
        if: ${{ inputs.publicar || github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MODO: ${{ inputs.publicar && 'manual' || 'automatico' }}
          LIB_OK: ${{ steps.lib.outputs.lib_ok }}
          # a chave que assinou o APK também assina o catálogo de dicionários da Release
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          KEY_PK8_B64: ${{ secrets.KEY_PK8_B64 }}
          CERT_PEM_B64: ${{ secrets.CERT_PEM_B64 }}
        run: bash docs/tools/publish_release.sh
