# Mr Keyboard: builds the APK with apktool, signs it and (optionally) publishes it to Releases.
#
# Compiles nothing native: it uses the libs already in lib/ (libjni_pckeyboard.so from native/ and libmrengine.so from engine/).
# To update them, see mr-native.yml.
#
# Result in Actions > (run) > Artifacts:
#   apk -> mr-keyboard-unsigned.apk (and mr-keyboard-signed.apk if there is a key in the secrets)
#
# Publishing a version: it happens on its own on a push to main when the versionName in apktool.yml is new (there is
# no Release with that tag yet) and the secrets hold a signing key. It can also be run by hand (Run
# workflow, with "publish" ticked), which treats any obstacle as an error.
# Each launch is ONE Release, tagged with the versionName (e.g. v1.72.0), with the notes from docs/release-notes/<tag>.md:
#   mr-keyboard-<tag>.apk          the signed APK, with the version in the name (ex.: mr-keyboard-v1.72.0.apk)
#   mr-keyboard-<tag>-source.zip   the source code of the published commit (git archive), enough to rebuild the APK
#   catalog.json                   the dictionary catalog, signed with the same key as the APK (the app reads
#                                  .../releases/latest/download/catalog.json)
#   update.json                    the notice of a new version (version, size and SHA-256 of the APK, notes in
#                                  Portuguese and English), signed the same way and read from .../latest/download/update.json
#   mr-keyboard-dict-<id>-<version>.zip   only the languages in dicts/ that changed in this version; the others keep
#                          their zip in the release that made it (the catalog says which one, in "release")
# The logic is in docs/tools/publish_release.sh (tested by docs/tools/publish_test/run.sh). A tag that
# already exists is never overwritten: raise versionCode/versionName first. Changed just one dictionary? Raise its
# version in dicts/<id>/pack.json and the app version: the new Release brings only that zip. Never delete a Release
# whose zip the catalog still uses (publish_release.sh checks it before creating anything).
# On an automatic push, without a key, with the version already published or with a stale lib/, nothing is published
# (only a warning) and the APK stays in the artifacts.
#
# Jobs: apk (builds and signs, no write permission) and checks (mr-checks.yml, the same checks as on every push) run
# together; publish runs only if BOTH passed. publish is the only job with write permission: it creates the Release and
# attests the APK and the source zip (build provenance, which "gh attestation verify" checks).
#
# Immutable releases (Settings > General > Releases > "Enable release immutability"): turn it on before the first
# publication. From then on a published release can no longer change (assets, tag), and GitHub signs a release attestation
# ("gh release verify"). publish_release.sh already creates the release as a draft, uploads everything and only then
# publishes it, which is how immutable releases are meant to be made. Because of this, a wrong release is fixed by a new
# version, never by editing the old one.
#
# Signing (optional): Settings > Secrets and variables > Actions, either way:
#   keystore: KEYSTORE_B64 (file in base64), KEYSTORE_PASS, KEY_ALIAS, KEY_PASS
#   pk8+pem:  KEY_PK8_B64 and CERT_PEM_B64 (both files in base64)
# Use the SAME key that signs the app today; with another key Android will not install over it.
# The same key signs the dictionary catalog and the update notice (docs/tools/sign_catalog.sh); the app only accepts
# them signed by the key of its own APK.
name: Mr Keyboard - APK

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the signed APK to Releases'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'smali/**'
      - 'res/**'
      - 'assets/**'
      - 'lib/**'
      - 'native-src.sha256'
      - 'apktool.yml'
      - '.github/workflows/mr-apk.yml'

permissions:
  contents: read

concurrency:
  group: mr-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  APKTOOL_VERSION: 2.11.1

jobs:
  apk:
    runs-on: ubuntu-24.04
    outputs:
      lib_ok: ${{ steps.lib.outputs.lib_ok }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that lib/ was built from the current native/ and engine/
        id: lib
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          CURRENT=$(find native/CMakeLists.txt native/src -type f -print0 | LC_ALL=C sort -z \
            | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          RECORDED=$(cat native-src.sha256 2>/dev/null | tr -d ' \r\n' || true)
          # the engine: the hash is computed from inside engine/ (same as mr-native.yml)
          CURRENT_ENGINE=$(cd engine && find CMakeLists.txt src -type f -print0 | LC_ALL=C sort -z \
            | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          RECORDED_ENGINE=$(cat mrengine-src.sha256 2>/dev/null | tr -d ' \r\n' || true)
          MISSING=""
          for abi in arm64-v8a armeabi-v7a x86; do
            for l in libjni_pckeyboard.so libmrengine.so; do
              [ -s "lib/$abi/$l" ] || MISSING="$MISSING lib/$abi/$l"
            done
          done
          if [ "$CURRENT" = "$RECORDED" ] && [ "$CURRENT_ENGINE" = "$RECORDED_ENGINE" ] && [ -z "$MISSING" ]; then
            echo "lib/ matches the current native/ and engine/"
            echo "lib_ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "lib_ok=false" >> "$GITHUB_OUTPUT"
          [ "$CURRENT" = "$RECORDED" ] || echo "native/ changed: native-src.sha256 is $RECORDED and the current code gives $CURRENT"
          [ "$CURRENT_ENGINE" = "$RECORDED_ENGINE" ] || echo "engine/ changed: mrengine-src.sha256 is $RECORDED_ENGINE and the current code gives $CURRENT_ENGINE"
          [ -z "$MISSING" ] || echo "missing from lib/:$MISSING"
          MSG="lib/ was not built from the current native/ and engine/. Run 'Mr Keyboard - native lib', extract the native-libs artifact at the project root and commit it."
          if [ "$PUBLISH" = "true" ]; then
            echo "::error::$MSG Nothing was published."; exit 1
          fi
          echo "::warning::$MSG"

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Build the APK with apktool
        run: |
          curl -sSL -o apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v$APKTOOL_VERSION/apktool_$APKTOOL_VERSION.jar"
          java -jar apktool.jar b . -o mr-keyboard-unsigned.apk
          unzip -lv mr-keyboard-unsigned.apk | grep -E "lib/"

      - name: Sign (only if the secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          KEY_PK8_B64: ${{ secrets.KEY_PK8_B64 }}
          CERT_PEM_B64: ${{ secrets.CERT_PEM_B64 }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KEYSTORE_B64" ]; then
            # keystore (.jks, .keystore or .p12) + alias and passwords
            # strip the spaces and line breaks that come in when the text is copied and pasted
            printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > key.jks || {
              echo "::error::KEYSTORE_B64 is not valid base64 (text cut short or with extra characters)"; exit 1; }
            echo "keystore: $(wc -c < key.jks) bytes"
            keytool -list -keystore key.jks -storepass "$KEYSTORE_PASS" > /dev/null 2>&1 || {
              echo "::error::could not open the keystore: wrong password (KEYSTORE_PASS) or incomplete file"; exit 1; }
            keytool -list -keystore key.jks -storepass "$KEYSTORE_PASS" -alias "$KEY_ALIAS" > /dev/null 2>&1 || {
              echo "::error::the alias KEY_ALIAS does not exist in the keystore"; exit 1; }
            SIGN="--ks key.jks --ks-pass env:KEYSTORE_PASS --ks-key-alias $KEY_ALIAS --key-pass env:KEY_PASS"
          elif [ -n "$KEY_PK8_B64" ] && [ -n "$CERT_PEM_B64" ]; then
            # pair of .pk8 + .x509.pem files (e.g. the test key some apktool apps use)
            printf '%s' "$KEY_PK8_B64" | tr -d ' \r\n\t' | base64 -d > key.pk8
            printf '%s' "$CERT_PEM_B64" | tr -d ' \r\n\t' | base64 -d > cert.pem
            SIGN="--key key.pk8 --cert cert.pem"
          else
            echo "no key: only the unsigned APK"; exit 0
          fi
          "$BT/zipalign" -p -f 4 mr-keyboard-unsigned.apk aligned.apk
          "$BT/apksigner" sign $SIGN --out mr-keyboard-signed.apk aligned.apk
          # the certificate SHA-256 must match the one of the app installed today
          "$BT/apksigner" verify --print-certs mr-keyboard-signed.apk
          rm -f key.jks key.pk8 cert.pem aligned.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: mr-keyboard-*.apk

  # the same checks as on every push (mr-checks.yml); nothing is published if one fails
  checks:
    if: ${{ inputs.publish || github.event_name == 'push' }}
    permissions:
      contents: read
    uses: ./.github/workflows/mr-checks.yml

  publish:
    needs: [apk, checks]
    if: ${{ inputs.publish || github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create and publish the Release
      id-token: write      # sign the attestations (OIDC)
      attestations: write  # store the attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Java signs the dictionary catalog and the update notice (docs/tools/sign_catalog.sh), the same Java as in the job "apk"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      # the APK is the one the job "apk" built and signed (the one the checks did not touch)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk

      - name: Publish to Releases
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.publish && 'manual' || 'automatic' }}
          LIB_OK: ${{ needs.apk.outputs.lib_ok }}
          # the key that signed the APK also signs the Release's dictionary catalog
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          KEY_PK8_B64: ${{ secrets.KEY_PK8_B64 }}
          CERT_PEM_B64: ${{ secrets.CERT_PEM_B64 }}
        run: bash docs/tools/publish_release.sh

      # only when this run published (publish_release.sh writes published=true); verify with:
      #   gh attestation verify mr-keyboard-<tag>.apk --repo <owner>/<repo>
      - name: Attest the APK and the source zip
        if: ${{ steps.publish.outputs.published == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.publish.outputs.apk }}
            ${{ steps.publish.outputs.source }}
