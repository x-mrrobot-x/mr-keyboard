# Mr Keyboard: generates the smali of the Java layer (MrBar, MrText, MrFix, ...) from docs/tools/java/src.
#
# Runs only by hand (Actions > "Mr Keyboard - smali" > Run workflow). Publishes nothing and does not change the repository.
# It is the same command that mr-checks.yml verifies (docs/tools/build_java.sh, with the dx from dex2jar 2.1 and the
# apktool versions pinned below), so the result is what check_java_smali.sh expects, byte for byte.
#
# When to use: after changing a .java in docs/tools/java/src (or when the "Java-layer smali up to date" step
# of mr-checks.yml reports DIFFERENT).
#
# Result in Actions > (run) > Artifacts:
#   generated-smali -> only the .smali files that have a Java source, with the path smali/com/mrkeyboard/app/.
#                   Extract it at the project root (overwriting) and commit.
# The run summary shows which repository files differ from the generated ones.
name: Mr Keyboard - smali

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APKTOOL_VERSION: 2.11.1
  DEX2JAR_URL: https://github.com/pxb1988/dex2jar/releases/download/v2.1/dex2jar-2.1.zip
  DEX2JAR_SHA256: 7a9bdf843d43de4d1e94ec2e7b6f55825017b0c4a7ee39ff82660e2493a46f08

jobs:
  smali:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Download apktool and dex2jar
        run: |
          curl -sSL -o apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v$APKTOOL_VERSION/apktool_$APKTOOL_VERSION.jar"
          curl -sSL -o dex2jar.zip "$DEX2JAR_URL"
          echo "$DEX2JAR_SHA256  dex2jar.zip" | sha256sum -c -
          unzip -q dex2jar.zip -d tools

      - name: Generate the smali (build_java.sh)
        env:
          DX_JAR: ${{ github.workspace }}/tools/dex-tools-2.1/lib/dx-27.0.3.jar
          APKTOOL_JAR: ${{ github.workspace }}/apktool.jar
        run: sh docs/tools/build_java.sh

      - name: Pick only the smali that has a Java source
        run: |
          # the same rule as check_java_smali.sh: Base.smali and Base$*.smali for each docs/tools/java/src/.../Base.java
          APP=smali/com/mrkeyboard/app
          DEST=generated-smali/$APP
          mkdir -p "$DEST"
          for java in docs/tools/java/src/com/mrkeyboard/app/*.java; do
            base=$(basename "$java" .java)
            for f in "$APP/$base.smali" "$APP/$base"'$'*.smali; do
              if [ -f "$f" ]; then cp "$f" "$DEST/"; fi
            done
          done
          echo "generated: $(ls "$DEST" | wc -l) files"

      - name: Summary - what differs from the repository
        run: |
          {
            echo "### Java-layer smali"
            echo
            if [ -z "$(git status --porcelain -- smali)" ]; then
              echo "The repository smali already equals the generated one. Nothing to do."
            else
              echo "Differs from the repository (replace with the ones from the \`generated-smali\` artifact):"
              echo
              echo '```'
              git status --short -- smali
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-smali
          path: generated-smali/
          retention-days: 14
          if-no-files-found: error
